[package]
name = "hdrezka-desktop"
version = "1.0.0"
description = "HDREZKA Unofficial Desktop Client for Windows"
authors = ["HDRezka Desktop Team"]
edition = "2021"

[lib]
name = "hdrezka_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
base64 = "0.22"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
