<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('color-scheme');
        var meta = document.querySelector('meta[name="color-scheme"]');
        delete document.documentElement.dataset.palette;
        if (meta) meta.content = saved === 'light' || saved === 'dark' ? saved : 'light dark';
        var resolved = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = resolved;
        document.documentElement.classList.toggle('dark', resolved === 'dark');
      } catch (e) {}
    </script>
    <title>HDREZKA Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark-void text-white font-sans antialiased select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full">
      <!-- Instant pre-React obsidian boot placeholder (replaced seamlessly on mount) -->
      <div
        aria-hidden="true"
        style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,rgba(255,18,79,0.22),transparent 52%),radial-gradient(circle at 72% 75%,rgba(255,122,0,0.18),transparent 54%),#070507;"
      >
        <div
          style="width:72px;height:72px;border-radius:9999px;padding:3px;background:linear-gradient(135deg,#FF124F 0%,#FF333D 45%,#FF7A00 100%);box-shadow:0 0 36px rgba(255,34,68,0.55);display:flex;align-items:center;justify-content:center;"
        >
          <div style="width:100%;height:100%;border-radius:9999px;background:#0B070A;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
